name: Publicar partidas

# Se ejecuta cuando el publicador sube o aprueba una partida, a mano desde la pestaña Actions,
# y cada mañana para reintentar redes que fallaron y marcar partidas pasadas en la web.
on:
  push:
    branches: [main]
    paths: ["partidas/**", "index.html", "publicador.js", "tools/**", ".github/workflows/publicar.yml"]
  workflow_dispatch:
    inputs:
      ensayo:
        description: "Ensayo: mostrar qué se publicaría, sin publicar"
        type: boolean
        default: false
  schedule:
    - cron: "0 12 * * *"  # 7:00 a. m. en Bogotá

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar-partidas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar en redes
        env:
          DRY_RUN: ${{ (inputs.ensayo || vars.DRY_RUN == '1') && '1' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHATS: ${{ vars.TELEGRAM_CHATS }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_HISTORIA: ${{ vars.IG_HISTORIA }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
        run: python -I tools/publicar.py

      - name: Actualizar índice de la web
        run: python -I tools/indice.py

      - name: Guardar resultados
        run: |
          git config user.name "publicador-partidas"
          git config user.email "publicador-partidas@users.noreply.github.com"
          git add partidas partidas.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Resultado de publicación e índice [automático]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
